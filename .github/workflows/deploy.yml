# Auto-deploy the server to the DigitalOcean droplet on every push to main.
#
# Trigger conditions:
#   - any push to main that touches server/, the built dashboard, or this
#     workflow file. Mobile-only changes are skipped (no need to restart
#     the API for a UI tweak).
#
#     admin-web/dist is in the list because Express serves the dashboard
#     straight out of the repo at /dashboard — a dashboard-only commit used
#     to land on GitHub and never reach the droplet, so the deployed UI
#     silently drifted behind main until someone deployed by hand.
#   - manual run via the "Run workflow" button in the Actions tab.
#
# Required GitHub repo secret:
#   DEPLOY_SSH_KEY — the *private* half of the ed25519 keypair whose
#                    public key lives in /home/iqmobile/.ssh/authorized_keys
#                    on the droplet. Generated locally; never committed.

name: Deploy server to DigitalOcean

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'admin-web/dist/**'
      - '.github/workflows/deploy.yml'
      - 'scripts/deploy-remote.sh'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Why this step is repeated three times.
      #
      # The droplet's sshd runs the stock MaxStartups 10:30:100 with
      # PerSourceMaxStartups unset, while a steady background of SSH
      # brute-force bots keeps roughly seven unauthenticated connections
      # open at all times. Past ten concurrent pre-auth connections sshd
      # begins refusing new ones at random, so the runner is dropped at
      # CONNECT — before it ever authenticates. On 2026-09-02 that failed
      # three of five deploys, each in about seven seconds with no output;
      # the changes only reached prod when a later push happened to get
      # through and carried them along, which is a silent way to believe
      # something shipped when it did not.
      #
      # Retrying is a mitigation, not the fix. The fix is on the droplet:
      # fail2ban plus a much higher MaxStartups (and PerSourceMaxStartups),
      # so honest connections are never the ones dropped.
      - name: Deploy (attempt 1)
        id: a1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 164.92.130.71
          username: iqmobile
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            cd ~/iqmobile
            git fetch --depth=1 origin main
            git reset --hard origin/main
            bash scripts/deploy-remote.sh
      - name: Back off before attempt 2
        if: steps.a1.outcome == 'failure'
        run: sleep 20
      - name: Deploy (attempt 2)
        if: steps.a1.outcome == 'failure'
        id: a2
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 164.92.130.71
          username: iqmobile
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            cd ~/iqmobile
            git fetch --depth=1 origin main
            git reset --hard origin/main
            bash scripts/deploy-remote.sh
      - name: Back off before attempt 3
        if: steps.a2.outcome == 'failure'
        run: sleep 45
      - name: Deploy (attempt 3)
        if: steps.a2.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 164.92.130.71
          username: iqmobile
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            cd ~/iqmobile
            git fetch --depth=1 origin main
            git reset --hard origin/main
            bash scripts/deploy-remote.sh
