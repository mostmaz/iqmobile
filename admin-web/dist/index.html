<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IQ Mobile Admin</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a1628;
        --card: #13243b;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #3b82f6;
        --gold: #fbbf24;
      }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      h1, h2, h3 { color: #fff; }
      button { background: var(--accent); color: #fff; border: 0; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
      button.secondary { background: #374151; }
      button.danger { background: #ef4444; }
      input { background: #1f2e47; color: #fff; border: 1px solid #374151; padding: 8px; border-radius: 4px; }
      .card { background: var(--card); padding: 16px; border-radius: 8px; margin-bottom: 12px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 8px; border-bottom: 1px solid #374151; text-align: left; }
      .pill { padding: 2px 8px; border-radius: 999px; font-size: 12px; }
      .pill.open { background: #10b981; }
      .pill.restricted { background: #f59e0b; }
      .pill.forced_open { background: #3b82f6; }
      .pill.forced_restrict { background: #ef4444; }
      a { color: var(--accent); }
      .nav { display: flex; gap: 12px; margin-bottom: 16px; }
      .nav a { padding: 6px 10px; border-radius: 4px; }
      .nav a.active { background: var(--accent); color: #fff; }

      /* Overview/Brands page layout — KPI cards, side-by-side chart cards,
         vertical activity lists. Responsive on narrow viewports via flex
         wrapping rather than media queries (keeps the CSS tiny). */
      .kpi-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
      .kpi { flex: 1 1 220px; }
      .kpi-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
      .kpi-value { color: #fff; font-size: 32px; font-weight: 700; margin-top: 6px; }
      .kpi-sub { margin-top: 4px; font-size: 12px; }
      .muted { color: var(--muted); }

      .chart-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
      .chart-card { flex: 1 1 360px; min-width: 0; }
      .chart-title { color: #fff; font-weight: 600; margin-bottom: 12px; }
      .empty { padding: 30px 0; text-align: center; }

      .activity-list { list-style: none; padding: 0; margin: 0; }
      .activity-list li { padding: 8px 0; border-bottom: 1px solid #1f2e47; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
      .activity-list li:last-child { border-bottom: 0; }
      .activity-list .ts { color: var(--muted); font-size: 12px; margin-left: auto; }

      /* Brands page extras */
      .data-table { width: 100%; }
      .data-table th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
      .data-table td { vertical-align: middle; }

      button.primary { background: #10b981; }
    </style>
    <script type="module" crossorigin src="/dashboard/assets/index-D-ZifPwX.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
