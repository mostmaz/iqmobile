<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IQ Mobile Admin</title>
    <style>
      /* Design tokens. Everything below composes from these, so a colour or
         spacing change happens in one place rather than across 15 pages.
         The old --card/--muted names are kept as aliases because several
         pages reference them directly. */
      :root {
        color-scheme: dark;
        --bg: #0a1220;
        --surface: #101c30;
        --surface-2: #16253c;
        --line: #1f3350;
        --line-soft: #172741;
        --text: #e8edf5;
        --text-dim: #93a3ba;
        --text-faint: #64748b;
        --accent: #3b82f6;
        --accent-dim: #1d4ed8;
        --ok: #10b981;
        --warn: #f59e0b;
        --danger: #ef4444;
        --gold: #fbbf24;

        --card: var(--surface);
        --muted: var(--text-dim);

        --r-sm: 6px;
        --r: 10px;
        --r-lg: 14px;
        --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.18);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        font-size: 14px; line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; color: #fff; margin: 0; }
      h2 { font-size: 16px; font-weight: 650; color: #fff; margin: 0 0 var(--s-3); }
      h3 { font-size: 14px; font-weight: 650; color: #fff; margin: 0 0 var(--s-2); }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      code { background: var(--surface-2); padding: 1px 5px; border-radius: var(--r-sm); font-size: 12.5px; }

      /* ── controls ── */
      button {
        background: var(--accent); color: #fff; border: 1px solid transparent;
        padding: 7px 13px; border-radius: var(--r-sm); cursor: pointer;
        font: inherit; font-size: 13px; font-weight: 550;
        transition: filter .12s ease, background .12s ease;
      }
      button:hover:not(:disabled) { filter: brightness(1.1); }
      button:disabled { opacity: .5; cursor: not-allowed; }
      button.secondary { background: var(--surface-2); color: var(--text); border-color: var(--line); }
      button.danger { background: var(--danger); }
      button.primary { background: var(--ok); }
      button.ghost { background: transparent; border-color: var(--line); color: var(--text-dim); }

      input, select, textarea {
        background: var(--surface-2); color: var(--text);
        border: 1px solid var(--line); padding: 7px 10px;
        border-radius: var(--r-sm); font: inherit; font-size: 13.5px;
      }
      input:focus, select:focus, textarea:focus {
        outline: none; border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(59,130,246,.15);
      }
      label { font-size: 13px; color: var(--text-dim); }

      /* ── shell ── */
      .app-header {
        display: flex; align-items: center; justify-content: space-between;
        gap: var(--s-4); margin-bottom: var(--s-4);
      }
      .brand { display: flex; align-items: center; gap: var(--s-2); }
      .brand-mark {
        width: 28px; height: 28px; border-radius: 8px; background: #d9583a;
        display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 13px;
      }

      /* Grouped nav. Sections keep 15 destinations findable — a flat row of
         15 links has no hierarchy, so everything reads equally important. */
      .nav { display: flex; gap: var(--s-4); flex-wrap: wrap; margin-bottom: var(--s-5);
             padding-bottom: var(--s-3); border-bottom: 1px solid var(--line-soft); }
      .nav-group { display: flex; flex-direction: column; gap: var(--s-1); }
      .nav-group-label {
        font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
        color: var(--text-faint); padding: 0 6px;
      }
      .nav-group-items { display: flex; gap: 2px; flex-wrap: wrap; }
      .nav a {
        padding: 5px 10px; border-radius: var(--r-sm); color: var(--text-dim);
        font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
      }
      .nav a:hover { background: var(--surface); color: var(--text); text-decoration: none; }
      .nav a.active { background: var(--accent); color: #fff; font-weight: 600; }
      .nav-badge {
        background: var(--warn); color: #1b1a18; font-size: 10.5px; font-weight: 800;
        border-radius: 999px; padding: 0 5px; min-width: 17px; text-align: center;
      }
      .nav a.active .nav-badge { background: #fff; color: var(--accent-dim); }

      /* ── surfaces ── */
      .card {
        background: var(--surface); padding: var(--s-4); border-radius: var(--r-lg);
        margin-bottom: var(--s-3); border: 1px solid var(--line-soft); box-shadow: var(--shadow);
      }

      /* ── work queue ── */
      .queue-row { display: flex; gap: var(--s-3); flex-wrap: wrap; margin-bottom: var(--s-4); }
      .queue-tile {
        flex: 1 1 165px; background: var(--surface); border: 1px solid var(--line-soft);
        border-radius: var(--r-lg); padding: var(--s-3) var(--s-4); cursor: pointer;
        display: flex; align-items: center; gap: var(--s-3); text-align: start;
        transition: border-color .12s ease, transform .12s ease;
      }
      .queue-tile:hover { border-color: var(--accent); transform: translateY(-1px); }
      .queue-tile.has-work { border-color: rgba(245,158,11,.45);
        background: linear-gradient(180deg, rgba(245,158,11,.07), transparent); }
      .queue-tile.is-clear { opacity: .62; }
      .queue-n { font-size: 26px; font-weight: 750; line-height: 1; color: #fff; }
      .queue-tile.is-clear .queue-n { color: var(--text-faint); }
      .queue-label { font-size: 12.5px; color: var(--text-dim); }

      /* ── KPIs ── */
      .kpi-row { display: flex; gap: var(--s-3); flex-wrap: wrap; margin-bottom: var(--s-3); }
      .kpi { flex: 1 1 200px; }
      .kpi-label { color: var(--text-faint); font-size: 10.5px; text-transform: uppercase;
                   letter-spacing: .08em; font-weight: 700; }
      .kpi-value { color: #fff; font-size: 30px; font-weight: 750; margin-top: 6px; letter-spacing: -0.02em; }
      .kpi-sub { margin-top: 4px; font-size: 12px; color: var(--text-dim); }
      .muted { color: var(--text-dim); }
      .faint { color: var(--text-faint); }

      .chart-row { display: flex; gap: var(--s-3); flex-wrap: wrap; margin-bottom: var(--s-3); }
      .chart-card { flex: 1 1 380px; min-width: 0; }
      .chart-title { color: #fff; font-weight: 600; margin-bottom: var(--s-3); }
      .empty { padding: var(--s-6) 0; text-align: center; color: var(--text-faint); }

      /* ── tables ── */
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); text-align: left; }
      th { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase;
           letter-spacing: .07em; font-weight: 700; }
      tbody tr:hover { background: rgba(255,255,255,.02); }
      tbody tr:last-child td { border-bottom: 0; }
      .data-table { width: 100%; }
      .data-table td { vertical-align: middle; }

      /* ── misc ── */
      .pill { padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
      .pill.open { background: var(--ok); }
      .pill.restricted { background: var(--warn); color: #1b1a18; }
      .pill.forced_open { background: var(--accent); }
      .pill.forced_restrict { background: var(--danger); }

      .activity-list { list-style: none; padding: 0; margin: 0; }
      .activity-list li { padding: 9px 0; border-bottom: 1px solid var(--line-soft);
                          display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
      .activity-list li:last-child { border-bottom: 0; }
      .activity-list .ts { color: var(--text-faint); font-size: 12px; margin-left: auto; }

      .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line);
             border-radius: var(--r); padding: 2px; gap: 2px; }
      .seg button { background: transparent; color: var(--text-dim); padding: 5px 12px; border: 0; }
      .seg button.on { background: var(--accent); color: #fff; }
    </style>
    <script type="module" crossorigin src="/dashboard/assets/index-BXGMQvtU.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
