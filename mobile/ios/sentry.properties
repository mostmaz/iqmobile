# Where the JS source maps go.
#
# Without org and project here, sentry-cli falls back to SENTRY_ORG /
# SENTRY_PROJECT env vars that nothing sets, and the build dies on "An
# organization ID or slug is required" — which is why every build so far
# carried SENTRY_DISABLE_AUTO_UPLOAD=true and no release ever uploaded maps.
#
# The cost of that showed up in crash triage: a production JS stack read
# `app:///index.android.bundle:1:126046` and could not be resolved to a line.
#
# The auth token is deliberately NOT here — it is a credential. EAS reads it
# from the SENTRY_AUTH_TOKEN secret; a local gradle build needs it exported,
# or SENTRY_DISABLE_AUTO_UPLOAD=true to skip upload entirely.
defaults.url=https://sentry.io/
defaults.org=iq-mobile
defaults.project=react-native
