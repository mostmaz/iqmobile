<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#171a2e">
<title>A gift for you</title>
<style>
/* ==========================================================================
   Gift reveal — a five-state machine, each step gated by a real gesture.
   Everything animates on transform/opacity only; nothing touches top/left,
   so the whole sequence stays on the compositor.
   ========================================================================== */

:root{
  --sky-1:#2b2350;      /* dusk, top    */
  --sky-2:#3d3266;
  --sky-3:#6b4d72;      /* warm horizon */
  --sky-4:#c98a76;
  --cream:#f4e9d8;      /* envelope     */
  --cream-dim:#e3d4bd;
  --cream-deep:#cdb99c;
  --ink:#241f34;
  --card:#fbf7f1;
  --metal-1:#d8c49a;    /* thin border on the card */
  --metal-2:#f0e3c6;
  --metal-3:#b99f6d;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-soft:cubic-bezier(.4,0,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);   /* slight overshoot */
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  height:100%;margin:0;
  overflow:hidden;                 /* full-viewport, never scrolls */
  overscroll-behavior:none;
  background:#241f34;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;
  color:#fff;
  user-select:none;-webkit-user-select:none;
}

/* Deep dusk sky. Two layers so the horizon glow can breathe independently. */
#stage{
  position:fixed;inset:0;
  display:grid;place-items:center;
  background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 42%,var(--sky-3) 78%,var(--sky-4) 100%);
  isolation:isolate;
}
#stage::after{                      /* soft horizon bloom */
  content:"";position:absolute;left:50%;bottom:-22%;
  width:130vmax;height:70vmax;transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 100%,rgba(255,190,150,.30),transparent 62%);
  pointer-events:none;z-index:0;
}

/* ---------- shared scene layer ---------- */
.scene{position:absolute;inset:0;display:grid;place-items:center;z-index:1}

/* =========================== STATE 1 — CLOUD ============================= */

#cloudScene{cursor:pointer;touch-action:manipulation}

#cloud{
  position:relative;width:210px;height:88px;
  transform:translateZ(0);
  animation:drift 13s var(--ease-soft) infinite alternate,
            breathe 6.5s ease-in-out infinite;
}
/* Fluffy = a handful of overlapping soft blobs, each its own element so the
   puff-apart can send them in different directions. */
.puff{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#ffffff,#e8e3f3 62%,#cfc8e6);
  box-shadow:0 18px 40px rgba(20,14,45,.35);
  transition:transform .72s var(--ease-out),opacity .6s ease-out;
}
.p1{width:104px;height:104px;left:52px;top:-16px}
.p2{width:76px;height:76px;left:6px;top:12px}
.p3{width:70px;height:70px;left:132px;top:16px}
.p4{width:116px;height:56px;left:44px;top:36px;border-radius:40px}
.p5{width:54px;height:54px;left:96px;top:-2px}

/* the burst: each blob flies off on its own vector */
#cloud.pop .p1{transform:translate3d(-6px,-58px,0) scale(1.5)}
#cloud.pop .p2{transform:translate3d(-72px,-16px,0) scale(1.35)}
#cloud.pop .p3{transform:translate3d(74px,-22px,0) scale(1.35)}
#cloud.pop .p4{transform:translate3d(4px,44px,0) scaleX(1.6)}
#cloud.pop .p5{transform:translate3d(18px,-72px,0) scale(1.4)}
#cloud.pop .puff{opacity:0}

@keyframes drift{from{transform:translate3d(-16px,0,0)}to{transform:translate3d(16px,-8px,0)}}
@keyframes breathe{0%,100%{scale:1}50%{scale:1.045}}

/* ---------- the invitation hint, shared by states 1–4 ---------- */
.hint{
  position:absolute;left:50%;transform:translateX(-50%);
  font-size:13px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,255,255,.62);font-weight:500;
  white-space:nowrap;pointer-events:none;
  animation:hintPulse 2.4s ease-in-out infinite;
}
#cloudHint{top:calc(50% + 92px)}
@keyframes hintPulse{0%,100%{opacity:.35}50%{opacity:.95}}

/* ======================= STATES 2–3 — ENVELOPE =========================== */

#envScene{opacity:0;pointer-events:none}
#envScene.on{opacity:1;pointer-events:auto}

/* perspective lives on the wrapper so the flap folds in real 3D */
#envWrap{
  position:relative;width:300px;height:198px;
  perspective:900px;
  transform:translate3d(0,-120vh,0);
  transform-style:preserve-3d;
}
#envWrap.drop{
  transform:translate3d(0,0,0);
  transition:transform .95s var(--spring);      /* the overshoot settle */
}
#envWrap.away{
  transform:translate3d(0,120vh,0) rotate(7deg);
  opacity:0;
  transition:transform 1s var(--ease-soft),opacity .9s ease-in;
}

/* back wall of the envelope — everything else stacks on top of it */
.env-back{
  position:absolute;inset:0;border-radius:14px;
  background:linear-gradient(170deg,var(--cream-dim),var(--cream-deep));
  box-shadow:0 30px 60px rgba(15,10,35,.5),0 6px 16px rgba(15,10,35,.35);
  z-index:1;
}

/* card travels inside here; the clip runs far upward so only the part BELOW
   the envelope's bottom edge is cut off */
#cardClip{
  position:absolute;left:0;right:0;bottom:0;height:1400px;
  overflow:hidden;z-index:2;pointer-events:none;
}

/* front panel with the classic V notch, drawn with clip-path so the card
   genuinely disappears behind it */
.env-front{
  position:absolute;inset:0;border-radius:14px;
  background:linear-gradient(165deg,var(--cream) 0%,var(--cream-dim) 100%);
  clip-path:polygon(0 0,50% 46%,100% 0,100% 100%,0 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
  z-index:3;pointer-events:none;
}
.env-front::after{                    /* faint seam down the middle */
  content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 46%,rgba(255,255,255,.35) 50%,transparent 54%);
}

/* the triangular top flap */
#flap{
  position:absolute;left:0;top:0;width:100%;height:96px;
  transform-origin:top center;
  transform:rotateX(0deg);
  transform-style:preserve-3d;
  z-index:5;                          /* in front while closed */
  will-change:transform;
}
.flap-face{
  position:absolute;inset:0;
  clip-path:polygon(0 0,100% 0,50% 100%);
  background:linear-gradient(180deg,var(--cream) 0%,var(--cream-deep) 100%);
  filter:drop-shadow(0 6px 10px rgba(15,10,35,.28));
}
#flap.behind{z-index:0}               /* flipped past 90° → goes behind */

/* the drag handle: rounded pill + upward chevron, bobbing to invite */
#handle{
  position:absolute;left:50%;top:64px;
  width:56px;height:30px;margin-left:-28px;
  border-radius:999px;
  background:rgba(36,31,52,.82);
  backdrop-filter:blur(6px);
  display:grid;place-items:center;
  z-index:6;cursor:grab;
  touch-action:none;                  /* pointer events only */
  box-shadow:0 6px 16px rgba(10,6,25,.45);
  animation:bob 1.7s ease-in-out infinite;
}
#handle:active{cursor:grabbing}
#handle svg{width:18px;height:18px;stroke:#fff;stroke-width:2.4;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
#handle.gone{opacity:0;transform:scale(.7);pointer-events:none;
  transition:opacity .3s,transform .3s}

#envHint{top:calc(50% + 132px)}

/* ========================= STATES 4–5 — CARD ============================= */

/* perspective for the flip lives on this layer */
#cardLayer{
  position:absolute;inset:0;display:grid;place-items:center;
  perspective:1400px;z-index:4;pointer-events:none;
}

/* position / scale / parallax tilt — kept separate from the flip so the two
   transforms never fight over the same property */
#cardPos{
  position:relative;width:236px;height:330px;
  transform-style:preserve-3d;
  will-change:transform;
  opacity:0;                       /* only appears once it is in the envelope */
}
#cardPos.live{opacity:1}

/* the flip itself */
#card{
  position:absolute;inset:0;
  transform-style:preserve-3d;
  transform:rotateY(0deg);
  will-change:transform;
}
#card.grab{touch-action:none;pointer-events:auto;cursor:grab}
#card.grab:active{cursor:grabbing}

.face{
  position:absolute;inset:0;border-radius:18px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  overflow:hidden;
  background:linear-gradient(160deg,var(--card) 0%,#efe7db 100%);
  box-shadow:0 26px 60px rgba(10,6,28,.55),0 8px 20px rgba(10,6,28,.35);
  display:grid;place-items:center;
  padding:26px;text-align:center;
}
/* thin metallic border, drawn as a gradient ring so it catches light */
.face::before{
  content:"";position:absolute;inset:0;border-radius:18px;padding:1.5px;
  background:linear-gradient(145deg,var(--metal-2),var(--metal-1) 35%,var(--metal-3) 60%,var(--metal-2));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;
}
.back{transform:rotateY(180deg)}

/* front: near-blank, with a travelling sheen */
.front-mark{
  font-size:11px;letter-spacing:.34em;text-transform:uppercase;
  color:rgba(36,31,52,.4);font-weight:600;
}
.sheen{
  position:absolute;top:-60%;left:-40%;width:60%;height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);
  transform:rotate(18deg);
  animation:sweep 3.6s ease-in-out infinite;
  pointer-events:none;
}
@keyframes sweep{0%{transform:translateX(-40%) rotate(18deg)}
  55%,100%{transform:translateX(320%) rotate(18deg)}}

/* back: the reveal */
.back-inner{display:grid;gap:12px;place-items:center}
.small-line{
  font-size:12.5px;letter-spacing:.30em;text-transform:uppercase;
  color:rgba(36,31,52,.55);font-weight:600;
}
.big-line{
  font-size:31px;line-height:1.12;font-weight:700;letter-spacing:-.015em;
  color:var(--ink);
}
.rule{width:34px;height:1.5px;background:linear-gradient(90deg,transparent,var(--metal-3),transparent)}

/* glow behind the card once revealed */
#glow{
  position:absolute;left:50%;top:50%;width:420px;height:420px;
  transform:translate(-50%,-50%) scale(.6);
  background:radial-gradient(circle,rgba(255,214,170,.55),rgba(255,170,140,.16) 45%,transparent 68%);
  opacity:0;transition:opacity .9s ease-out,transform 1.1s var(--ease-out);
  pointer-events:none;z-index:3;
}
#glow.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

#cardHint{top:calc(50% + 196px)}

/* Hides a hint properly — the pulse keyframes animate opacity, so an inline
   opacity:0 alone is overridden on every frame. */
.hidden{opacity:0 !important;animation:none !important;pointer-events:none !important}

/* ---------- confetti ---------- */
#confetti{position:absolute;inset:0;z-index:9;pointer-events:none}

/* ---------- replay ---------- */
#replay{
  position:absolute;right:16px;top:16px;z-index:12;
  padding:9px 15px;border-radius:999px;border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.09);backdrop-filter:blur(10px);
  color:rgba(255,255,255,.9);font-size:12.5px;letter-spacing:.08em;
  font-weight:600;cursor:pointer;opacity:0;pointer-events:none;
  transition:opacity .5s ease-out;
  font-family:inherit;
}
#replay.on{opacity:1;pointer-events:auto}
#replay:active{transform:scale(.95)}

/* ==========================================================================
   Reduced motion: ambient movement stops, every interaction survives.
   ========================================================================== */
@media (prefers-reduced-motion:reduce){
  #cloud{animation:none}
  #handle{animation:none}
  .hint{animation:none;opacity:.75}
  .sheen{display:none}
  #envWrap.drop{transition:transform .01s linear}
  #envWrap.away{transition:transform .01s linear,opacity .01s linear}
}
</style>
</head>
<body>

<div id="stage">

  <!-- STATE 1 -->
  <div class="scene" id="cloudScene">
    <div id="cloud">
      <div class="puff p1"></div><div class="puff p2"></div><div class="puff p3"></div>
      <div class="puff p4"></div><div class="puff p5"></div>
    </div>
    <div class="hint" id="cloudHint">Tap the cloud</div>
  </div>

  <!-- STATES 2–3 -->
  <div class="scene" id="envScene">
    <div id="envWrap">
      <div class="env-back"></div>

      <!-- the card lives here while it is still inside the envelope -->
      <div id="cardClip"></div>

      <div class="env-front"></div>

      <div id="flap"><div class="flap-face"></div></div>

      <div id="handle" aria-label="Drag up to open">
        <svg viewBox="0 0 24 24"><polyline points="6 14 12 8 18 14"></polyline></svg>
      </div>
    </div>
    <div class="hint" id="envHint">Drag the tab up</div>
  </div>

  <!-- STATES 4–5 -->
  <div id="glow"></div>
  <div id="cardLayer">
    <div id="cardPos">
      <div id="card">
        <div class="face front">
          <div class="sheen"></div>
          <div class="front-mark">Swipe to flip</div>
        </div>
        <div class="face back">
          <div class="back-inner">
            <div class="small-line" id="revealSmall"></div>
            <div class="rule"></div>
            <div class="big-line" id="revealBig"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="hint hidden" id="cardHint">Swipe to flip</div>

  <canvas id="confetti"></canvas>
  <button id="replay">Replay</button>
</div>

<script>
"use strict";
/* ==========================================================================
   TUNABLES — everything worth adjusting lives here.
   ========================================================================== */
const CONFIG = {
  // State 2 — flap
  FLAP_DRAG_PX:        120,   // drag distance mapped to a full 180° fold
  FLAP_OPEN_AT:        0.60,  // release past this fraction → snaps open

  // State 3 — pulling the card out
  CARD_PULL_PX:        250,   // drag distance for the card to clear the envelope
  CARD_OUT_AT:         0.70,  // release past this fraction → it comes all the way out
  CARD_PEEK_PX:        22,    // how far the card's top edge shows once the flap opens

  // State 4 — flip
  FLIP_DRAG_PX:        200,   // horizontal drag mapped to a 180° turn
  FLIP_AT:             0.50,  // release past this fraction → snaps to the back

  // Timings (ms)
  ENVELOPE_DROP_MS:    950,
  CARD_TO_CENTER_MS:   760,
  SNAP_MS:             480,

  // State 5 — reveal
  REVEAL_SMALL: "Welcome your new",
  REVEAL_BIG:   "iPhone 18 Pro",
  CONFETTI_COUNT: 110,
  CONFETTI_GRAVITY: 0.16,
  TILT_MAX_DEG: 9,            // parallax tilt at the card's edges
};

const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- element handles ---------- */
const $ = (id) => document.getElementById(id);
const cloudScene = $("cloudScene"), cloud = $("cloud"), cloudHint = $("cloudHint");
const envScene = $("envScene"), envWrap = $("envWrap"), flap = $("flap"),
      handle = $("handle"), cardClip = $("cardClip"), envHint = $("envHint");
const cardLayer = $("cardLayer"), cardPos = $("cardPos"), card = $("card"),
      cardHint = $("cardHint"), glow = $("glow");
const replay = $("replay"), canvas = $("confetti"), ctx = canvas.getContext("2d");

$("revealSmall").textContent = CONFIG.REVEAL_SMALL;
$("revealBig").textContent   = CONFIG.REVEAL_BIG;

/* ==========================================================================
   State machine. Each step is gated: `state` only ever moves forward, and
   every pointer handler checks it before doing anything.
   ========================================================================== */
const S = { CLOUD:1, FLAP:2, PULL:3, FLIP:4, DONE:5 };
let state = S.CLOUD;

/* live drag values, kept out of the DOM so reads stay cheap */
let flapDeg = 0;        // 0 → -180
let cardY   = 0;        // px pulled up, 0 → CARD_PULL_PX
let flipDeg = 0;        // 0 → 180

/* ---------- helpers ---------- */
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;

/* Apply the flap rotation and swap its stacking once it passes vertical, so
   the folded flap correctly sits BEHIND the envelope. */
function renderFlap(){
  flap.style.transform = "rotateX(" + flapDeg + "deg)";
  flap.classList.toggle("behind", flapDeg < -90);
}
function renderCard(){
  cardEl.style.transform = "translate3d(0," + (-cardY) + "px,0)";
}
function renderFlip(){
  card.style.transform = "rotateY(" + flipDeg + "deg)";
}

/* A tiny transition helper: run a CSS transition, then clean it off so the
   next pointer drag is immediate again. */
function animate(el, prop, from, to, ms, easing, done){
  if (REDUCED) ms = 1;
  el.style.transition = prop + " " + ms + "ms " + easing;
  requestAnimationFrame(() => {
    to();
    setTimeout(() => { el.style.transition = ""; done && done(); }, ms + 20);
  });
  from && from();
}

/* ==========================================================================
   STATE 1 → 2 : tap the cloud, envelope drops in
   ========================================================================== */
cloudScene.addEventListener("pointerdown", onCloudTap, { passive:true });

function onCloudTap(){
  if (state !== S.CLOUD) return;
  state = S.FLAP;

  cloud.classList.add("pop");
  cloudHint.classList.add("hidden");

  setTimeout(() => {
    cloudScene.style.display = "none";
    envScene.classList.add("on");
    // force a frame so the starting off-screen transform is committed first
    requestAnimationFrame(() => envWrap.classList.add("drop"));
  }, REDUCED ? 0 : 420);
}

/* ==========================================================================
   STATE 2 : drag the flap open
   Drag distance maps 1:1 to rotation while the finger is down.
   ========================================================================== */
let flapStartY = 0, flapFrom = 0;

handle.addEventListener("pointerdown", (e) => {
  if (state !== S.FLAP) return;
  handle.setPointerCapture(e.pointerId);
  flapStartY = e.clientY;
  flapFrom = flapDeg;
  flap.style.transition = "";
  e.preventDefault();
});

handle.addEventListener("pointermove", (e) => {
  if (state !== S.FLAP || !handle.hasPointerCapture(e.pointerId)) return;
  const dy = flapStartY - e.clientY;                  // up is positive
  const frac = clamp((-flapFrom / 180) + dy / CONFIG.FLAP_DRAG_PX, 0, 1);
  flapDeg = -180 * frac;
  renderFlap();
});

handle.addEventListener("pointerup", endFlapDrag);
handle.addEventListener("pointercancel", endFlapDrag);

function endFlapDrag(e){
  if (state !== S.FLAP || !handle.hasPointerCapture(e.pointerId)) return;
  handle.releasePointerCapture(e.pointerId);
  const frac = -flapDeg / 180;

  if (frac >= CONFIG.FLAP_OPEN_AT){
    // snap fully open, then hand over to the card pull
    flap.style.transition = "transform " + CONFIG.SNAP_MS + "ms var(--ease-out)";
    flapDeg = -180; renderFlap();
    handle.classList.add("gone");
    setTimeout(openedEnvelope, REDUCED ? 0 : CONFIG.SNAP_MS);
  } else {
    // spring back shut
    flap.style.transition = "transform " + CONFIG.SNAP_MS + "ms var(--spring)";
    flapDeg = 0; renderFlap();
  }
}

/* ==========================================================================
   STATE 3 : pull the card out
   The card is a real element inside #cardClip, so the envelope's front panel
   occludes it and the clip cuts anything below the envelope's bottom edge —
   it genuinely looks like it is sliding out rather than being revealed.
   ========================================================================== */
let cardEl = null;                    // built lazily when the envelope opens

function openedEnvelope(){
  state = S.PULL;
  envHint.textContent = "Pull the card out";

  // move the real card element into the envelope's clip
  cardEl = cardPos;
  cardEl.style.position = "absolute";
  cardEl.style.left = "50%";
  cardEl.style.bottom = "-104px";     // most of it hidden below the front panel
  cardEl.style.marginLeft = "-118px";
  cardEl.style.transform = "translate3d(0,0,0)";
  cardClip.appendChild(cardEl);
  cardClip.style.pointerEvents = "auto";

  // let the peeking top edge be grabbed
  cardEl.classList.add("live");
  cardEl.style.touchAction = "none";
  cardEl.style.cursor = "grab";
  cardY = CONFIG.CARD_PEEK_PX;
  renderCard();

  cardEl.addEventListener("pointerdown", startPull);
}

let pullStartY = 0, pullFrom = 0;

function startPull(e){
  if (state !== S.PULL) return;
  cardEl.setPointerCapture(e.pointerId);
  pullStartY = e.clientY; pullFrom = cardY;
  cardEl.style.transition = "";
  e.preventDefault();
}
function movePull(e){
  if (state !== S.PULL || !cardEl.hasPointerCapture(e.pointerId)) return;
  const dy = pullStartY - e.clientY;
  cardY = clamp(pullFrom + dy, 0, CONFIG.CARD_PULL_PX);   // 1:1 with the finger
  renderCard();
}
function endPull(e){
  if (state !== S.PULL || !cardEl.hasPointerCapture(e.pointerId)) return;
  cardEl.releasePointerCapture(e.pointerId);

  if (cardY / CONFIG.CARD_PULL_PX >= CONFIG.CARD_OUT_AT){
    cardOut();
  } else {
    cardEl.style.transition = "transform " + CONFIG.SNAP_MS + "ms var(--spring)";
    cardY = CONFIG.CARD_PEEK_PX; renderCard();
  }
}
document.addEventListener("pointermove", movePull);
document.addEventListener("pointerup", endPull);
document.addEventListener("pointercancel", endPull);

/* card has cleared the envelope: fly it to centre, drop the envelope away */
function cardOut(){
  state = S.FLIP;
  cardEl.removeEventListener("pointerdown", startPull);
  envHint.classList.add("hidden");

  // hand the card back to the full-screen layer, preserving where it looks
  const r = cardEl.getBoundingClientRect();
  cardLayer.appendChild(cardEl);
  cardEl.style.position = ""; cardEl.style.left = ""; cardEl.style.bottom = "";
  cardEl.style.marginLeft = "";
  const target = cardEl.getBoundingClientRect();
  const dx = r.left - target.left, dy = r.top - target.top;

  cardEl.style.transition = "none";
  cardEl.style.transform = "translate3d(" + dx + "px," + dy + "px,0)";

  requestAnimationFrame(() => {
    cardEl.style.transition = "transform " + CONFIG.CARD_TO_CENTER_MS + "ms var(--ease-out)";
    cardEl.style.transform = "translate3d(0,0,0) scale(1.06)";
    envWrap.classList.add("away");
    setTimeout(readyToFlip, REDUCED ? 0 : CONFIG.CARD_TO_CENTER_MS);
  });
}

/* ==========================================================================
   STATE 4 : swipe to flip
   ========================================================================== */
function readyToFlip(){
  cardEl.style.transition = "";
  card.classList.add("grab");
  cardLayer.style.pointerEvents = "auto";
  cardHint.classList.remove("hidden");
  card.addEventListener("pointerdown", startFlip);
}

let flipStartX = 0, flipFrom = 0, flipping = false;

function startFlip(e){
  if (state !== S.FLIP) return;
  card.setPointerCapture(e.pointerId);
  flipping = true;
  flipStartX = e.clientX; flipFrom = flipDeg;
  card.style.transition = "";
  e.preventDefault();
}
function moveFlip(e){
  if (!flipping) return;
  const dx = e.clientX - flipStartX;
  flipDeg = clamp(flipFrom + (dx / CONFIG.FLIP_DRAG_PX) * 180, 0, 180);
  renderFlip();
}
function endFlip(e){
  if (!flipping) return;
  flipping = false;
  try { card.releasePointerCapture(e.pointerId); } catch(_){}

  card.style.transition = "transform " + CONFIG.SNAP_MS + "ms var(--ease-out)";
  if (flipDeg / 180 >= CONFIG.FLIP_AT){
    flipDeg = 180; renderFlip();
    setTimeout(reveal, REDUCED ? 0 : CONFIG.SNAP_MS * 0.7);
  } else {
    flipDeg = 0; renderFlip();
  }
}
document.addEventListener("pointermove", moveFlip);
document.addEventListener("pointerup", endFlip);
document.addEventListener("pointercancel", endFlip);

/* ==========================================================================
   STATE 5 : reveal — glow, confetti, and a live parallax tilt
   ========================================================================== */
function reveal(){
  if (state === S.DONE) return;
  state = S.DONE;
  card.removeEventListener("pointerdown", startFlip);
  cardHint.classList.add("hidden");
  glow.classList.add("on");
  replay.classList.add("on");
  burst();
  if (!REDUCED) window.addEventListener("pointermove", tilt, { passive:true });
}

/* subtle tilt that follows the pointer across the card */
function tilt(e){
  const r = cardPos.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const nx = clamp((e.clientX - cx) / (r.width  * 1.6), -1, 1);
  const ny = clamp((e.clientY - cy) / (r.height * 1.6), -1, 1);
  cardPos.style.transform =
    "scale(1.06) rotateY(" + (nx * CONFIG.TILT_MAX_DEG) + "deg)" +
    " rotateX(" + (-ny * CONFIG.TILT_MAX_DEG) + "deg)";
}

/* ---------------------------- confetti ---------------------------------- */
let parts = [], raf = 0;

function sizeCanvas(){
  const d = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = innerWidth * d; canvas.height = innerHeight * d;
  ctx.setTransform(d,0,0,d,0,0);
}
sizeCanvas();
addEventListener("resize", sizeCanvas);

function burst(){
  const COLORS = ["#f0d9a8","#e8b98c","#cdb99c","#fbf7f1","#d8c49a","#b6a4d8"];
  const ox = innerWidth / 2, oy = innerHeight / 2;
  const n = REDUCED ? Math.round(CONFIG.CONFETTI_COUNT / 3) : CONFIG.CONFETTI_COUNT;

  parts = [];
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 4 + Math.random() * 9;
    parts.push({
      x: ox, y: oy,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 3,
      w: 5 + Math.random() * 6,
      h: 8 + Math.random() * 8,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3,
      c: COLORS[(Math.random() * COLORS.length) | 0],
      life: 1,
    });
  }
  cancelAnimationFrame(raf);
  tick();
}

function tick(){
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  let alive = 0;

  for (const p of parts){
    if (p.life <= 0) continue;
    alive++;
    p.vy += CONFIG.CONFETTI_GRAVITY;
    p.vx *= 0.995;
    p.x += p.vx; p.y += p.vy;
    p.rot += p.vr;
    p.life -= 0.0075;

    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.c;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  }
  if (alive) raf = requestAnimationFrame(tick);
  else ctx.clearRect(0, 0, innerWidth, innerHeight);
}

/* ==========================================================================
   Replay — return every element to its starting pose.
   ========================================================================== */
replay.addEventListener("click", () => {
  cancelAnimationFrame(raf);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  window.removeEventListener("pointermove", tilt);

  state = S.CLOUD;
  flapDeg = 0; cardY = 0; flipDeg = 0; flipping = false;

  // card back to its layer, untransformed
  cardLayer.appendChild(cardPos);
  cardPos.style.cssText = "";
  cardPos.classList.remove("live");
  card.style.transition = ""; card.style.transform = "rotateY(0deg)";
  card.classList.remove("grab");
  cardLayer.style.pointerEvents = "none";
  cardEl = null;

  // envelope back above the fold, closed
  envWrap.classList.remove("drop","away");
  envScene.classList.remove("on");
  flap.style.transition = ""; renderFlap();
  handle.classList.remove("gone");
  cardClip.style.pointerEvents = "none";

  envHint.textContent = "Drag the tab up";
  envHint.classList.remove("hidden");
  cardHint.classList.add("hidden");
  glow.classList.remove("on");
  replay.classList.remove("on");

  // cloud back
  cloud.classList.remove("pop");
  cloudScene.style.display = "";
  cloudHint.classList.remove("hidden");
});

/* stop iOS rubber-banding / long-press callouts on the stage itself */
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive:false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
</script>
</body>
</html>
